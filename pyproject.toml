[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-quant-monitor"
version = "0.1.0"
description = "Local-first, extensible China A-share quantitative market data monitor"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "akshare>=1.18,<2",
  "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.28",
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<0.25",
]

[project.scripts]
quant-monitor = "quant_monitor.main:cli"

[tool.setuptools.packages.find]
include = ["quant_monitor*"]

[tool.setuptools.package-data]
quant_monitor = ["default_config.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
